[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "supabase>=2.31.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:supabase.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*httpx.*starlette.testclient.*",
]
